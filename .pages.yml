media:
  - name: blog_images
    label: Immagini del blog
    input: public/images/blog
    output: /images/blog
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif]
    rename: safe

  - name: gallery_images
    label: Foto della galleria
    input: public/images/gallery
    output: /images/gallery
    categories: [image]
    extensions: [jpg, jpeg, png, webp, avif]
    rename: random

settings:
  content:
    merge: true
  commit:
    identity: user
    templates:
      create: "blog: pubblica {filename}"
      update: "blog: aggiorna {filename}"
      delete: "blog: elimina {filename}"
      rename: "blog: rinomina {oldFilename} in {newFilename}"

content:
  - name: gallery
    label: Galleria fotografica
    type: file
    path: content/gallery.json
    format: json
    fields:
      - name: images
        label: Foto in galleria
        type: object
        description: "Aggiungi una scheda per ogni foto. Trascina le schede per cambiare l'ordine, poi salva. Per pubblicare una foto disattiva Bozza."
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Titolo della foto
            type: string
            required: true
          - name: src
            label: Carica o scegli la foto
            type: image
            required: true
            description: "Carica il file originale in JPG, PNG, WebP o AVIF. Se il telefono usa HEIC, esporta prima la foto in JPG."
            options:
              media: gallery_images
              extensions: [jpg, jpeg, png, webp, avif]
              rename: random
          - name: category
            label: Categoria
            type: select
            required: true
            default: studio
            options:
              values:
                - name: studio
                  label: Interni dello Studio
                - name: esterni
                  label: Ingresso
                - name: eventi
                  label: Eventi e convegni
                - name: territorio
                  label: Luoghi
          - name: location
            label: Luogo
            type: string
            description: "Per esempio: Sarno, Napoli, Roma."
          - name: caption
            label: Didascalia
            type: text
            description: "Una breve descrizione dell'incontro o del luogo fotografato."
          - name: alt
            label: Descrizione per accessibilità
            type: string
            description: "Descrivi ciò che si vede nella foto. Se lasci vuoto, viene usato il titolo."
          - name: orientation
            label: Orientamento della foto
            type: select
            required: true
            default: landscape
            options:
              values:
                - name: landscape
                  label: Orizzontale
                - name: portrait
                  label: Verticale
          - name: span
            label: Dimensione nella griglia desktop
            type: select
            default: regular
            options:
              values:
                - name: regular
                  label: Standard
                - name: wide
                  label: Panoramica
                - name: tall
                  label: Verticale
                - name: large
                  label: Grande, in evidenza
          - name: date
            label: Data dell'evento (facoltativa)
            type: date
            options:
              format: yyyy-MM-dd
          - name: draft
            label: Bozza (non visibile nella galleria)
            type: boolean
            default: true
            description: "Disattiva per pubblicare la foto, poi premi Salva. Dopo l'aggiornamento automatico apparirà nella galleria."

  - name: blog
    label: Articoli del blog
    type: collection
    path: content/blog
    format: yaml-frontmatter
    # Il nome del file viene generato automaticamente dal titolo.
    # Non mostriamo il campo filename: lasciandolo vuoto Pages CMS
    # tentava di creare un file senza estensione.
    filename: "{slug}.mdx"
    exclude: [README.md, _template.mdx]
    subfolders: false
    view:
      primary: title
      fields: [title, date, category, author, draft, featured]
      sort: [date, title, category, author]
      search: [title, excerpt, category, author, body]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titolo
        type: string
        required: true
      - name: slug
        label: Indirizzo dell'articolo
        type: string
        required: true
        pattern:
          regex: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          message: Usa solo lettere minuscole, numeri e trattini, senza spazi.
        description: "Esempio: ricorso-tar-appalti. Non modificarlo dopo la pubblicazione."
      - name: date
        label: Data di pubblicazione
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: author
        label: Autore
        type: select
        required: true
        default: Avv. Luigi Ferrara
        options:
          values: [Avv. Luigi Ferrara, Avv. Nunzia Robustelli, LF Business]
      - name: category
        label: Categoria
        type: select
        required: true
        default: News
        options:
          values:
            - Diritto Amministrativo
            - Appalti Pubblici
            - TAR e Consiglio di Stato
            - Diritto d'Impresa
            - Internazionalizzazione
            - LF Business
            - Edilizia e Urbanistica
            - Diritto Scolastico
            - Bioetica
            - Intelligenza Artificiale
            - Antitrust
            - News
      - name: excerpt
        label: Riassunto
        type: text
        required: true
        description: Due o tre righe usate nell'anteprima e nella descrizione Google.
        options:
          minlength: 40
          maxlength: 220
      - name: coverImage
        label: Immagine di copertina
        type: image
        required: true
        default: /images/blog/placeholder.png
        options:
          media: blog_images
          extensions: [jpg, jpeg, png, webp, avif]
          rename: safe
      - name: featured
        label: In evidenza
        type: boolean
        default: false
      - name: draft
        label: Bozza (non visibile sul sito)
        type: boolean
        default: true
        description: Disattiva questa opzione quando l'articolo è pronto per la pubblicazione.
      - name: body
        label: Testo dell'articolo
        type: rich-text
        required: true
        options:
          format: markdown
          media: blog_images
          switcher: true
          extensions: [jpg, jpeg, png, webp, avif]
          rename: safe
